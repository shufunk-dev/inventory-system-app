# SearXNG settings configuration
use_default_settings: true

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "inventorysystemsearxngsecretkey"

search:
  safe_search: 0
  request_timeout: 10.0
  formats:
    - html
    - json

outgoing:
  request_timeout: 10.0
  max_request_timeout: 15.0
  pool_connections: 100
  pool_maxsize: 100

engines:
  - name: duckduckgo
    timeout: 10.0
    disabled: false
  - name: bing
    timeout: 10.0
    disabled: false
  - name: yahoo
    timeout: 10.0
    disabled: false
  - name: qwant
    timeout: 10.0
    disabled: false
  - name: startpage
    timeout: 10.0
    disabled: false
